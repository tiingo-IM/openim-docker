name: Docker Deployment Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

  workflow_dispatch:

jobs:
  docker-build:
    name: Test docker deployment on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4.2.0

      - name: Run Docker Compose
        run: |
          docker compose up -d
          docker compose ps

      - name: Test OpenIM Server
        run: |
          check_error() {
            echo "Response: $1"
            errCode=$(echo $1 | jq -r '.errCode')
            if [ "$errCode" != "0" ]; then
              errMsg=$(echo $1 | jq -r '.errMsg')
              echo "Error: $errMsg"
              exit 1
            fi
          }

          wait_for_service() {
            local url=$1
            local max_retries=30
            local retry_count=0
            local response

            until [ $retry_count -ge $max_retries ]
            do
              response=$(curl -s -o /dev/null -w "%{http_code}" $url) || true
              if [ "$response" != "000" ]; then
                echo "Service at $url is up"
                return 0
              fi
              retry_count=$((retry_count+1))
              echo "Waiting for service at $url to be up... ($retry_count/$max_retries)"
              echo "Response code: $response"
              sleep 6
            done

            echo "Service at $url failed to start"
            exit 1
          }

          wait_for_service http://127.0.0.1:10002/auth/get_admin_token

          get_admin_token_response=$(curl -X POST -H "Content-Type: application/json" -H "operationID: imAdmin" -d '{
            "secret": "openIM123",
            "platformID": 2,
            "userID": "imAdmin"
          }' http://127.0.0.1:10002/auth/get_admin_token)
          check_error "$get_admin_token_response"
          adminToken=$(echo $get_admin_token_response | jq -r '.data.token')
          echo "adminToken: $adminToken"

          echo "ADMIN_TOKEN=$adminToken" >> $GITHUB_ENV
          # docker logs openim-server

      - name: Test OpenIM chat
        run: |
          check_error() {
            echo "Response: $1"
            errCode=$(echo $1 | jq -r '.errCode')
            if [ "$errCode" != "0" ]; then
              errMsg=$(echo $1 | jq -r '.errMsg')
              echo "Error: $errMsg"
              exit 1
            fi
          }

          wait_for_service() {
            local url=$1
            local max_retries=30
            local retry_count=0
            local response

            until [ $retry_count -ge $max_retries ]
            do
              response=$(curl -s -o /dev/null -w "%{http_code}" $url) || true
              if [ "$response" != "000" ]; then
                echo "Service at $url is up"
                return 0
              fi
              retry_count=$((retry_count+1))
              echo "Waiting for service at $url to be up... ($retry_count/$max_retries)"
              echo "Response code: $response"
              sleep 10
            done

            echo "Service at $url failed to start"
            exit 1
          }

          # Wait all Service
          wait_for_service http://127.0.0.1:10008/account/pass_login
          wait_for_service http://127.0.0.1:10002/auth/get_admin_token

          # Signing up and in are Passport's now (chat takes only a pass), and
          # there is no Passport here: the two users are made in openim
          # directly, which is all the message test below needs.
          userID1="ci$(date +%s)1"
          userID2="ci$(date +%s)2"
          register_response=$(curl -X POST -H "Content-Type: application/json" -H "operationID: imAdmin" -H "token: ${{ env.ADMIN_TOKEN }}" -d '{
            "users": [
              {"userID": "'$userID1'", "nickname": "test12312"},
              {"userID": "'$userID2'", "nickname": "test22312"}
            ]
          }' http://127.0.0.1:10002/user/user_register)
          check_error "$register_response"

          # 1-1 messages need the two users to be friends (friendOnlyChat
          # defaults on). One import writes both rows, so it is mutual.
          import_friend_response=$(curl -X POST -H "Content-Type: application/json" -H "operationID: imAdmin" -H "token: ${{ env.ADMIN_TOKEN }}" -d '{
            "ownerUserID": "'$userID1'",
            "friendUserIDs": ["'$userID2'"]
          }' http://127.0.0.1:10002/friend/import_friend)
          check_error "$import_friend_response"

          # Test send message
          send_msg_response=$(curl -X POST -H "Content-Type: application/json" -H "operationID: imAdmin" -H "token: ${{ env.ADMIN_TOKEN }}" -d '{
            "sendID": "'$userID1'",
            "recvID": "'$userID2'",
            "senderPlatformID": 3,
            "content": {
              "content": "hello!!"
            },
            "contentType": 101,
            "sessionType": 1
           }' http://127.0.0.1:10002/msg/send_msg)
           check_error "$send_msg_response"

          get_user_response=$(curl -X POST -H "Content-Type: application/json" -H "operationID: imAdmin" -H "token: ${{ env.ADMIN_TOKEN }}" -d '{
            "pagination": {
               "pageNumber": 1,
               "showNumber": 100
             }
            }' http://127.0.0.1:10002/user/get_users)
          check_error "$get_user_response"

  go-test:
    name: Benchmark Test with go ${{ matrix.go_version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SDK_DIR: openim-sdk-core
      CONFIG_PATH: docker-compose.yaml
    strategy:
      matrix:
        os: [ubuntu-latest]
        go_version: ["stable"]

    steps:
      - name: Checkout Docker repository
        uses: actions/checkout@v7

      - name: Checkout SDK repository
        uses: actions/checkout@v7
        with:
          repository: "openimsdk/openim-sdk-core"
          ref: "main"
          path: ${{ env.SDK_DIR }}

      - name: Set up Go ${{ matrix.go_version }}
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ matrix.go_version }}
          cache: false

      - name: Modify Server Configuration
        run: |
          yq eval '.services.openim-server.environment += ["IMENV_NOTIFICATION_GROUPCREATED_UNREADCOUNT=TRUE"]' -i ${{ env.CONFIG_PATH }}
          yq eval '.services.openim-server.environment += ["IMENV_NOTIFICATION_FRIENDAPPLICATIONAPPROVED_UNREADCOUNT=TRUE"]' -i ${{ env.CONFIG_PATH }}
          yq eval '.services.openim-server.environment += ["IMENV_SHARE_SECRET=123456"]' -i ${{ env.CONFIG_PATH }}

      - name: Start Server Services
        run: |
          docker compose up -d

      - name: Build test SDK core
        run: |
          cd ${{ env.SDK_DIR }}
          go mod tidy
          cd integration_test
          mkdir data
          go run main.go -lgr 0.8 -imf -crg -ckgn -ckcon -sem -ckmsn -u 20 -su 5 -lg 2 -cg 2 -cgm 3 -sm 10 -gm 10 -reg
